name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - claude-code
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - claude-code
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  # `devcontainer features test` can only assert that an install succeeds, so the version floor gets its
  # own negative test. The guard runs before any download, so this is quick.
  test-version-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Reject a pin older than the supported minimum"
        run: |
          set -e
          if docker run --rm -e VERSION=2.1.82 -v "$PWD/src/claude-code:/f:ro" \
               mcr.microsoft.com/devcontainers/base:ubuntu bash /f/install.sh > out.txt 2>&1; then
            echo "::error::install.sh accepted version 2.1.82, which is below the 2.1.83 floor"
            cat out.txt
            exit 1
          fi
          grep -q "older than the minimum supported" out.txt
          echo "Correctly rejected: $(head -1 out.txt)"

      - name: "Accept the minimum supported version"
        run: |
          set -e
          docker run --rm -e VERSION=2.1.83 -v "$PWD/src/claude-code:/f:ro" \
            mcr.microsoft.com/devcontainers/base:ubuntu bash /f/install.sh > out.txt 2>&1
          grep -q "Claude Code installed: 2.1.83" out.txt
          echo "Correctly accepted the boundary version"
