# ---------------------------------------------------------------------------
# Egress policy for the dev container. Default deny.
#
# Only the hosts listed in allowed-domains.txt are reachable, over HTTP or
# HTTPS. HTTPS is filtered on the hostname in the CONNECT request and then
# tunnelled verbatim — Squid never decrypts, so there is no CA to install and
# no TLS stack to placate.
# ---------------------------------------------------------------------------

# The dev container's address on the internal Compose network.
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# One entry per line. A leading dot matches the domain and all its subdomains;
# a bare entry matches only that exact host.
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager

http_access allow localnet allowed_domains
http_access deny all

http_port 3128

# This is a policy gateway, not a cache. Caching would only make the audit log
# lie about what was actually fetched.
cache deny all

# This config intentionally does not include /etc/squid/conf.d/, because the
# image ships a `http_access allow localnet` there that would defeat the
# allowlist. The one setting worth keeping from it is the descriptor cap:
# without it Squid sizes itself for whatever RLIMIT_NOFILE the container
# inherits, which on hosts that set it high (1048576 is common) makes it
# reserve several hundred MB of RSS at startup.
max_filedescriptors 1024

# Log to files under /var/log/squid, which is writable by the `proxy` user that
# Squid drops to. The image's entrypoint tails these to the container's stdout,
# so this is what `docker compose logs egress` shows. Writing straight to
# /dev/stdout does not work here — the proxy user cannot reopen Docker's
# stdout pipe, and Squid exits with FATAL.
logfile_rotate 0
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Don't leak the dev container's internal address to upstream servers.
forwarded_for delete
httpd_suppress_version_string on

# Keep `docker compose restart egress` snappy when you edit the allowlist.
shutdown_lifetime 5 seconds
