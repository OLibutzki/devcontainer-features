services:
  dev:
    # Pinned to the LTS rather than the floating `:ubuntu` tag (now 26.04
    # "resolute") for a known-good base. The feature test matrix below still
    # runs against the floating tag; this pin only affects the container the
    # tests are driven *from*.
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    init: true
    command: sleep infinity
    # rootless-podman's own capAdd/securityOpt are Feature-level properties and are merged in by the
    # devcontainer CLI automatically -- no `privileged: true` needed, that was only ever for
    # docker-in-docker's inner daemon.
    #
    # --device is not a Feature-mergeable property (and devcontainer.json's `runArgs` is ignored for
    # Compose-based configs), so the two devices rootless Podman needs to actually start containers
    # (see src/rootless-podman/NOTES.md) are declared directly here instead.
    devices:
      - /dev/fuse
      - /dev/net/tun
    volumes:
      - ../..:/workspaces:cached
      # Claude Code's credentials, settings and history. Without this you sign in
      # again after every rebuild. Compose scopes the volume to this project.
      - claude-config:/home/vscode/.claude
      # Keep Podman's image/container storage out of the container's writable
      # layer, so a rebuild does not re-pull every test base image. Rootless
      # Podman's graphroot defaults to $HOME/.local/share/containers (no
      # graphroot override in the feature's storage.conf), not under
      # /var/lib/rootless-podman -- that path only holds the runtime socket,
      # which is intentionally *not* persisted (see NOTES.md "Persistence").
      - podman-storage:/home/vscode/.local/share/containers
    networks:
      # The only network this container is on, and it has `internal: true`.
      # There is no default route to the internet here — the sole way out is the
      # egress proxy below. Unsetting the proxy variables does not grant access;
      # it just removes the one path that works.
      - egress-internal
    depends_on:
      egress:
        condition: service_healthy
    environment:
      # Addressed by IP, not by the `egress` service name, because containers
      # started by rootless Podman get their own (slirp4netns/pasta) network
      # namespace, are not on the Compose network, and cannot resolve it. They
      # route to this address through the dev container.
      HTTP_PROXY: http://10.99.0.2:3128
      HTTPS_PROXY: http://10.99.0.2:3128
      http_proxy: http://10.99.0.2:3128
      https_proxy: http://10.99.0.2:3128
      NO_PROXY: localhost,127.0.0.1,::1,egress
      no_proxy: localhost,127.0.0.1,::1,egress
      # Optional operational telemetry, switched off rather than allowlisted.
      # devcontainer.json `containerEnv` is ignored for Compose-based containers,
      # so project-wide env belongs here. (Feature `containerEnv` still applies.)
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  egress:
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
      - ./egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks:
      egress-internal:
        # Pinned so the proxy has an address that is stable across restarts and
        # reachable from inside rootless Podman's containers, where Compose DNS
        # does not go.
        ipv4_address: 10.99.0.2
      egress-external: {}
    # Intentionally no `ports:` — the proxy is reachable from the dev container
    # and from nowhere else, not from the host and not from the LAN.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/3128' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  egress-internal:
    internal: true
    ipam:
      config:
        - subnet: 10.99.0.0/24
  egress-external:
    driver: bridge

volumes:
  claude-config:
  podman-storage:
